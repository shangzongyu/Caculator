[tools]
go = "1.27.4"
golangci-lint = "2.15.0"

[tasks.start]
description = "启动计算器"
run = "go run ."

[tasks.dev]
description = "启动 MyGo 热重载开发环境"
run = "go tool mygo dev"

[tasks.test]
description = "运行单元和界面测试"
run = "go test ./..."

[tasks.generate]
description = "生成 MyGo 多语言访问器"
run = "go tool mygo generate"

[tasks.fmt]
description = "应用 modernize 自动修复并格式化 Go 源码"
run = [
  "golangci-lint run --config .golangci.yml --enable-only modernize --fix ./...",
  "golangci-lint fmt --config .golangci.yml",
]

[tasks.lint]
description = "运行 golangci-lint 静态检查"
run = "golangci-lint run --config .golangci.yml ./..."

[tasks.vet]
description = "运行 Go 静态检查"
run = "go vet ./..."

[tasks.build]
description = "为当前平台打包应用"
run = "go tool mygo build"
